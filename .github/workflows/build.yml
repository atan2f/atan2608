name: Build

on:
  workflow_dispatch:      # allow manual runs (e.g. to re-test without a version bump)
  push:
    branches: [main]
    paths: [version.txt]
  pull_request:
    branches: [main]
    paths: [version.txt]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxext-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Compiler cache so JUCE isn't recompiled from scratch every run. Keyed on
      # file content, so it survives checkout's mtime reset (a build-dir cache
      # would not). Requires the Ninja generator - the Visual Studio generator
      # ignores compiler launchers, which is why CI uses Ninja on both platforms.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}

      - name: Configure
        run: >
          cmake -B release-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Build only the two shipped formats. The test target is intentionally not
      # built in CI - tests are run locally before pushing.
      - name: Build
        run: cmake --build release-build --target AudioPlugin_Standalone AudioPlugin_VST3

      - name: Prepare VST3 artifact
        shell: bash
        run: |
          mkdir artifact-vst3
          cp -r release-build/AudioPlugin_artefacts/Release/VST3/atan2608.vst3 artifact-vst3/

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: atan2608-${{ steps.version.outputs.version }}-VST3-${{ matrix.name }}
          path: artifact-vst3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: atan2608-${{ steps.version.outputs.version }}-Standalone-${{ matrix.name }}
          path: |
            release-build/AudioPlugin_artefacts/Release/Standalone/atan2608.exe
            release-build/AudioPlugin_artefacts/Release/Standalone/atan2608
